<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arun AK Hacker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a1a;
    font-family: system-ui, sans-serif;
    padding: 20px;
  }
  .photo-link {
    display: inline-block;
    cursor: pointer;
    line-height: 0;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    max-width: 100%;
  }
  .photo-link:hover {
    transform: translateY(-6px) scale(1.01);
    box-shadow: 0 18px 50px rgba(0,150,255,0.35);
  }
  .photo-link img {
    display: block;
    width: 100%;
    max-width: 500px;
    height: auto;
  }
</style>
</head>
<body>

  <a class="photo-link"
     href="https://arunakhacker.netlify.app/"
     target="_blank"
     rel="noopener noreferrer">
    <img src="photo.jpg" alt="Arun AK Hacker">
  </a>

</body>
</html>
